<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZB Brain – Demo Tổng quan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{--brand:#004c97;--brand-700:#003366;--brand-900:#001a38;--brand-400:#2a73c2;--brand-200:#b9d3ef;--brand-soft:#eaf2fb;--accent:#f47a20;--accent-soft:#fff1e6;
--ok:#0f9d6b;--ok-soft:#e6f6ef;--teal:#0f9d8a;--violet:#7c5cc4;--text:#0f1b2d;--text-2:#475569;--muted:#8693a6;--line:#e6ebf2;--bg:#f4f7fb;--ease:cubic-bezier(.22,.8,.26,1);
--shadow:0 1px 2px rgba(16,40,80,.05),0 4px 16px rgba(16,40,80,.06);--shadow-lg:0 10px 30px rgba(16,40,80,.14)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Be Vietnam Pro",system-ui,sans-serif;color:var(--text);background:var(--bg)}
button{font:inherit;cursor:pointer}
/* ---- thanh chọn bản demo ---- */
.demo-bar{position:fixed;z-index:50;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:#0b1730;box-shadow:var(--shadow-lg);align-items:center}
.demo-bar span{color:#9db1d6;font-size:12px;padding:0 10px}
.demo-bar button{border:0;background:none;color:#cfe0f5;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px}
.demo-bar button.on{background:var(--accent);color:#fff}
/* ---- khung ---- */
.sidebar{position:fixed;inset:0 auto 0 0;width:236px;background:linear-gradient(180deg,var(--brand-700),var(--brand-900));color:#cfe0f5;padding:14px 12px;display:flex;flex-direction:column;overflow:auto}
.logo-btn{all:unset;display:block;width:100%;cursor:pointer;border-radius:16px;position:relative}
.logo-card{display:grid;place-items:center;height:84px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);transition:transform .25s var(--ease),background .25s,border-color .25s,box-shadow .25s}
.logo-card b{font-size:34px;letter-spacing:-.04em;color:#fff;font-weight:800}.logo-card b i{font-style:normal;color:var(--accent)}
.logo-btn:hover .logo-card{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.logo-btn:active .logo-card{transform:scale(.98)}
.logo-btn:focus-visible .logo-card{outline:2px solid var(--accent);outline-offset:2px}
.logo-btn.hint .logo-card{animation:hint 1.6s infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(244,122,32,.55)}60%{box-shadow:0 0 0 12px rgba(244,122,32,0)}}
.side-app{text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7f9bc4;margin:10px 0 14px}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f8cb8;margin:14px 8px 6px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer;color:#cfe0f5;transition:background .2s}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell{margin-left:236px;min-height:100vh}
.topbar{height:52px;display:flex;align-items:center;padding:0 28px;gap:8px;color:var(--muted);background:#fff;border-bottom:1px solid var(--line)}
.topbar b{color:var(--text)}
main{max-width:1060px;margin:0 auto;padding:26px 24px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.page-ph{padding:60px 20px;text-align:center;color:var(--text-2)}
.page-ph h2{margin:0 0 8px;color:var(--text)}
/* ---- hero ---- */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:30px;border-radius:20px;color:#fff;background:linear-gradient(120deg,var(--brand-700),var(--brand) 55%,#0a63bd);box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 260px at 90% 0,rgba(255,255,255,.14),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 36px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 36px)}
.hero>*{position:relative}
.hero-date{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#cfe0f5;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.hero-date i{width:7px;height:7px;border-radius:50%;background:#46e3a0;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(70,227,160,.6)}100%{box-shadow:0 0 0 9px rgba(70,227,160,0)}}
.hero h1{margin:14px 0 8px;font-size:30px;line-height:1.2;letter-spacing:-.02em}.hero h1 em{font-style:normal;color:#ffb37a}
.hero p{margin:0;color:#d6e5f7;max-width:520px}
.hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;color:#fff;background:linear-gradient(180deg,#ff8a3a,var(--accent))}
.btn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
.hero-panel{padding:18px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.hp-head{display:flex;justify-content:space-between;font-size:12.5px;color:#cfe0f5;margin-bottom:12px}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(70,227,160,.18);color:#7ff0bd}
.hero-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-kpis div{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07)}
.hero-kpis b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.hero-kpis span{font-size:12px;color:#b9d3ef}
/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}
.kpi{cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--brand-200)}
.kpi-top{display:flex;justify-content:space-between;align-items:center}
.kpi-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand)}
.kpi-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi-num{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:14px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-lbl{color:var(--text-2);font-weight:500}.kpi-sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi-bar{height:4px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.kpi-bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:4px;transition:width 1.1s var(--ease) .3s}
/* mini ring (bản đề xuất) */
.mring{position:relative;width:46px;height:46px}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:5}.mring .bg{stroke:#edf1f7}
.mring .fg{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset 1.2s var(--ease) .3s}
.mring .ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand)}
.mring .ic svg{width:18px;height:18px;transform:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi.good .mring .fg{stroke:var(--ok)}.kpi.good .mring .ic{color:var(--ok)}
.kpi.good .kpi-sub{color:var(--ok);font-weight:600}
.kpi .pct{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:999px}
.kpi.good .pct{color:var(--ok);background:var(--ok-soft)}
/* ---- lưới ---- */
.ov-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-head h3{margin:0;font-size:15px;display:flex;gap:10px;align-items:center}
.ico-chip{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand)}
.ico-chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sub{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font-weight:500}
/* bar hiện tại */
.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.track{height:12px;border-radius:8px;background:#edf1f7;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--brand-400),var(--brand));transition:width 1s var(--ease)}
.v{text-align:right;font-variant-numeric:tabular-nums}
.chart-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
/* bar đề xuất */
.stack{display:flex;height:14px;border-radius:10px;overflow:hidden;gap:3px;margin-bottom:6px}
.stack i{display:block;width:0;border-radius:4px;background:var(--c);transition:width 1.1s var(--ease) .15s,opacity .2s}
.stack-cap{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.rbar{display:grid;grid-template-columns:22px 1fr 44px 44px;gap:10px;align-items:center;padding:8px 8px;margin:0 -8px;border-radius:10px;cursor:default;transition:background .2s,opacity .25s,transform .25s var(--ease)}
.rbar .rk{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c)}
.rbar .nm{font-size:13px;line-height:1.3}
.rbar .nm .tr{display:block;height:8px;border-radius:6px;background:#edf1f7;margin-top:6px;overflow:hidden}
.rbar .nm .tr i{display:block;height:100%;width:0;border-radius:6px;background:var(--c);transition:width 1s var(--ease) .2s}
.rbar b{text-align:right;font-variant-numeric:tabular-nums}.rbar .sh{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart-wrap:hover .rbar,.chart-wrap:hover .stack i{opacity:.35}
.chart-wrap .rbar:hover{opacity:1;background:var(--brand-soft);transform:translateX(3px)}
.chart-wrap:has(.rbar[data-k="0"]:hover) .stack i[data-k="0"],.chart-wrap:has(.rbar[data-k="1"]:hover) .stack i[data-k="1"],.chart-wrap:has(.rbar[data-k="2"]:hover) .stack i[data-k="2"],.chart-wrap:has(.rbar[data-k="3"]:hover) .stack i[data-k="3"]{opacity:1}
/* health */
.health{display:flex;gap:22px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.ring .bg{stroke:#edf1f7}
.ring .fg{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.4s var(--ease) .2s}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:28px;line-height:1}.ring .c span{font-size:11px;color:var(--muted);margin-top:4px}
.meters{flex:1;display:grid;gap:11px}
.meter .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.meter .bar{height:6px;border-radius:6px;background:#edf1f7;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--brand);transition:width 1.1s var(--ease) .4s}
.meter.low .bar i{background:var(--accent)}
/* health đề xuất: 3 mức màu + gợi ý */
.v2 .meter.good .bar i{background:var(--ok)}.v2 .meter.good .row b{color:var(--ok)}
.v2 .meter.mid .bar i{background:var(--brand)}
.v2 .meter.low .bar i{background:var(--accent)}.v2 .meter.low .row b{color:var(--accent)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.nextstep{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid #ffd9bd;cursor:pointer;transition:transform .2s var(--ease)}
.nextstep:hover{transform:translateX(3px)}
.nextstep .ni{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.nextstep .ni svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nextstep b{display:block;font-size:13px}.nextstep span{font-size:12px;color:var(--text-2)}
.health-note{display:flex;gap:8px;font-size:12px;color:var(--muted);margin:14px 0 0}
/* chuyển trang + xuất hiện lần lượt */
.enter>*{animation:rise .6s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v2 .kpis>*{animation:rise .6s var(--ease) both}
.v2 .kpis>*:nth-child(1){animation-delay:.1s}.v2 .kpis>*:nth-child(2){animation-delay:.17s}.v2 .kpis>*:nth-child(3){animation-delay:.24s}.v2 .kpis>*:nth-child(4){animation-delay:.31s}
.note-demo{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:#fff8e6;border:1px solid #f3dca0;color:#6b5200;font-size:13px}
.only2,.only1{display:none}.v2 .only2{display:revert}.v1 .only1{display:revert}
.v2 .only1{display:none!important}.v1 .only2{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.sidebar{display:none}.shell{margin:0}.hero,.ov-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head>
<body class="v2">
<aside class="sidebar">
  <button class="logo-btn hint" id="logo" title="Về trang Tổng quan" aria-label="AZB Brain – về trang Tổng quan">
    <div class="logo-card"><b>A<i>Z</i>B</b></div>
  </button>
  <div class="side-app">Brain · Tri thức điều hành</div>
  <nav class="nav" id="nav">
    <div class="nav-group" style="margin-top:0">Điều hành</div>
    <button data-v="overview" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Tổng quan</span></button>
    <button data-v="chart"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 8v4M5 16.5V12h14v4.5"/></svg><span>Sơ đồ tổ chức</span></button>
    <button data-v="units"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h6"/></svg><span>Phòng ban</span></button>
    <button data-v="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><span>Nhân sự</span></button>
    <div class="nav-group">Tri thức</div>
    <button data-v="docs"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span>Tài liệu</span></button>
    <button data-v="chat"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span>Trợ lý AI</span></button>
  </nav>
</aside>
<div class="shell">
  <header class="topbar"><span>AZB Brain</span><span>›</span><b id="title">Tổng quan</b></header>
  <main id="main"></main>
</div>
<div class="demo-bar"><span>Xem bản:</span><button data-ver="1">Hiện tại</button><button data-ver="2" class="on">Đề xuất</button><button id="sim">▶ Thử bấm logo từ trang khác</button></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const I={
 users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',
 layers:'<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>',
 brief:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
 userx:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 9l5 5M22 9l-5 5"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>'
};
const D={divs:[["Khối Thi công · Các Ban QLDA",172],["Khối Văn phòng",109],["Khối Thi công · Văn phòng khối",32],["Khối Dịch vụ",14]],total:327,left:181,
 meters:[["Chức danh đã có người đảm nhiệm",100],["Phòng/ban đã có quy trình",72],["Khối/phòng đã có mục tiêu",28],["Đơn vị đã xác nhận tên",85],["Nhân sự đủ họ tên",100]]};
const COL=["#004c97","#0f9d8a","#f47a20","#7c5cc4"];
let ver=2;

function kpi(ico,label,n,sub,p,good){
  if(ver===1) return `<div class="card kpi"><div class="kpi-top"><span class="kpi-ico">${I[ico]}</span></div><div class="kpi-num" data-n="${n}">0</div><div class="kpi-lbl">${label}</div><div class="kpi-sub">${sub}</div><div class="kpi-bar"><i data-w="${p}"></i></div></div>`;
  return `<div class="card kpi ${good?"good":""}"><div class="kpi-top"><div class="mring"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="18"/><circle class="fg" cx="23" cy="23" r="18" data-p="${p}"/></svg><span class="ic">${good?I.check:I[ico]}</span></div><span class="pct">${p}%</span></div><div class="kpi-num" data-n="${n}">0</div><div class="kpi-lbl">${label}</div><div class="kpi-sub">${sub}</div></div>`;
}
function staff(){
  const max=D.divs[0][1];
  if(ver===1) return `<div class="card"><div class="card-head"><h3><span class="ico-chip">${I.users}</span><span>Nhân sự theo khối<span class="sub">Người đang làm việc, theo danh sách HCNS</span></span></h3><button class="link">Xem tất cả →</button></div>
   ${D.divs.map(([d,n])=>`<div class="hbar"><span>${d}</span><span class="track"><span class="fill" data-w="${n/max*100}"></span></span><b class="v">${n}</b></div>`).join("")}
   <div class="chart-foot"><span>4 khối / nhóm</span><span>Tổng <b>327</b> người</span></div></div>`;
  return `<div class="card"><div class="card-head"><h3><span class="ico-chip">${I.users}</span><span>Nhân sự theo khối<span class="sub">Người đang làm việc, theo danh sách HCNS</span></span></h3><button class="link">Xem tất cả →</button></div>
   <div class="chart-wrap"><div class="stack">${D.divs.map(([d,n],i)=>`<i data-k="${i}" style="--c:${COL[i]}" data-w="${n/D.total*100}"></i>`).join("")}</div>
   <div class="stack-cap">Tỷ trọng nhân sự giữa các khối (tổng ${D.total} người)</div>
   ${D.divs.map(([d,n],i)=>`<div class="rbar" data-k="${i}" style="--c:${COL[i]}"><span class="rk">${i+1}</span><span class="nm">${d}<span class="tr"><i data-w="${n/max*100}"></i></span></span><b>${n}</b><span class="sh">${Math.round(n/D.total*100)}%</span></div>`).join("")}</div>
   <div class="chart-foot"><span>4 khối / nhóm · rê chuột để so sánh</span><span>Tổng <b>327</b> người</span></div></div>`;
}
function health(){
  const cls=p=>ver===1?(p<50?"low":""):(p>=80?"good":p>=50?"mid":"low");
  const low=[...D.meters].sort((a,b)=>a[1]-b[1])[0];
  return `<div class="card ${ver===2?"v2":""}"><div class="card-head"><h3><span class="ico-chip">${I.check}</span><span>Mức độ hoàn thiện dữ liệu<span class="sub">Càng đầy đủ, AI tư vấn càng chính xác</span></span></h3></div>
   <div class="health"><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" cx="60" cy="60" r="54" data-p="77"/></svg><div class="c"><b data-n="77" data-s="%">0</b><span>Tổng thể</span></div></div>
   <div class="meters">${D.meters.map(([l,p])=>`<div class="meter ${cls(p)}"><div class="row"><span>${l}</span><b>${p}%</b></div><div class="bar"><i data-w="${p}"></i></div></div>`).join("")}</div></div>
   ${ver===2?`<div class="legend"><span><i style="background:var(--ok)"></i>≥ 80% tốt</span><span><i style="background:var(--brand)"></i>50–79% khá</span><span><i style="background:var(--accent)"></i>&lt; 50% cần bổ sung</span></div>
   <div class="nextstep"><span class="ni">${I.target}</span><span><b>Việc nên làm tiếp: ${low[0].toLowerCase()} (${low[1]}%)</b><span>Nhập mục tiêu cho các khối/phòng còn thiếu để AI tư vấn sát hơn.</span></span></div>`
   :`<p class="health-note">Trợ lý AI tra cứu trực tiếp cơ sở dữ liệu mỗi lần trả lời – dữ liệu mới nhập được dùng ngay.</p>`}</div>`;
}
function overview(){
  const h=new Date().getHours();
  const hello=h<11?"Chào buổi sáng":h<14?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối";
  return `<div class="enter ${ver===2?"v2":"v1"}" id="ovw">
  <section class="hero"><div><span class="hero-date"><i></i>Thứ Bảy, 24/10/2026</span><h1>${hello}, <em>admin</em></h1>
   <p>Bức tranh toàn cảnh Công ty Cổ phần AZB: cơ cấu tổ chức, nhân sự, quy trình và mức độ sẵn sàng của dữ liệu cho trợ lý AI.</p>
   <div class="hero-actions"><button class="btn">✦ Hỏi trợ lý AI</button><button class="btn ghost">Xem sơ đồ tổ chức</button></div></div>
   <div class="hero-panel"><div class="hp-head"><span>Kho tri thức công ty</span><span class="pill">● AI sẵn sàng</span></div>
   <div class="hero-kpis"><div><b data-n="54">0</b><span>Đơn vị trong sơ đồ</span></div><div><b data-n="252">0</b><span>Tài liệu đã lưu</span></div><div><b data-n="0">0</b><span>Quy trình</span></div><div><b data-n="14">0</b><span>Mục tiêu kinh doanh</span></div></div></div></section>
  <div class="kpis">
   ${kpi("users","Nhân sự đang làm việc",327,"181 người đã nghỉ trong hồ sơ",64,false)}
   ${kpi("layers","Khối điều hành",6,"25 phòng / ban trực thuộc",100,false)}
   ${kpi("brief","Chức danh trên sơ đồ",37,"100% đã có người đảm nhiệm",100,true)}
   ${kpi("userx","Vị trí đang trống",0,"Đã đủ người",100,true)}
  </div>
  <div class="ov-grid">${staff()}${health()}</div></div>`;
}
function ph(name){return `<div class="card page-ph"><h2>${name}</h2><p>Đây là trang mô phỏng.</p><p><b>Bấm vào logo AZB góc trên bên trái</b> để quay về Tổng quan.</p></div>`}

function countUp(root){
  root.querySelectorAll("[data-n]").forEach(el=>{const to=+el.dataset.n,suf=el.dataset.s||"",t0=performance.now();
    const f=t=>{const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e).toLocaleString("vi-VN")+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
function animate(root){
  countUp(root);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll("[data-w]").forEach(e=>e.style[e.matches(".stack i")?"width":"width"]=e.dataset.w+"%");
    root.querySelectorAll(".mring .fg").forEach(e=>e.style.strokeDashoffset=113.1*(1-e.dataset.p/100));
    root.querySelectorAll(".ring .fg").forEach(e=>e.style.strokeDashoffset=339.3*(1-e.dataset.p/100));
  }));
}
const TITLES={overview:"Tổng quan",chart:"Sơ đồ tổ chức",units:"Phòng ban",people:"Nhân sự",docs:"Tài liệu",chat:"Trợ lý AI"};
let cur="overview";
function go(v){
  cur=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
  $("#title").textContent=TITLES[v];
  $("#main").innerHTML=v==="overview"?overview():ph(TITLES[v]);
  animate($("#main"));scrollTo({top:0});
}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)};
$("#logo").onclick=()=>{$("#logo").classList.remove("hint");go("overview")};
$("#sim").onclick=()=>{go("units");$("#logo").classList.add("hint")};
document.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>{
  ver=+b.dataset.ver;document.body.className="v"+ver;
  document.querySelectorAll("[data-ver]").forEach(x=>x.classList.toggle("on",x===b));go("overview")});
go("overview");
</script></body></html>
